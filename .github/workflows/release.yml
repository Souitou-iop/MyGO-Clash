# Builds every platform when a version tag such as v0.2.0 is pushed, and
# uploads the installers, packages and signed updates to a draft release.
# Publishing the draft makes it the version that installed apps update to.
# A pre-release tag such as v0.2.0-beta is published as a pre-release once
# every platform is built: installed apps are never offered pre-releases.
#
# Running the workflow by hand with a tag, from the commit to release, tags
# that commit on GitHub instead.
#
# Needs the MYGO_UPDATER_PRIVATE_KEY secret, the key that signs updates:
#   gh secret set MYGO_UPDATER_PRIVATE_KEY < path/to/mygo-update.key
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to create and release, such as v0.2.0-beta"
        required: true
      notes_only:
        description: "Only rewrite the notes of the existing release, from CHANGELOG.md and its files"
        type: boolean
        default: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    if: ${{ !inputs.notes_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: test "$TAG" = "v$(jq -r .version mygo.json)"
      - name: Write the release notes
        # The downloads are added once the files are uploaded, in finish.
        run: .github/release-notes.sh "$TAG" > notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft $prerelease --target "$GITHUB_SHA" --title "MyGO-Clash $TAG" --notes-file notes.md
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/amd64,darwin/arm64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Install squashfs-tools, for the AppImages
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run build -platform "${{ matrix.platform }}"
      - name: Make the Windows installers
        # Replaces the installer mygo makes, under the same name, with the
        # one of packaging/windows: language choice, reinstall and upgrade
        # pages, closing the running app, removing the service on uninstall.
        if: matrix.name == 'Windows'
        run: go run ./tools/winsetup build/windows-amd64 build/windows-arm64
      - name: Name the Windows installers after their architecture
        # Both are "<name> Setup <version>.exe" otherwise.
        if: matrix.name == 'Windows'
        run: |
          for dir in build/windows-*; do
            arch="${dir##*-}"
            for exe in "$dir"/*" Setup "*.exe; do
              mv "$exe" "${exe%.exe}-$arch.exe"
            done
          done
      - name: Name the macOS disk images after their architecture
        # Both are "<name> <version>.dmg" otherwise.
        if: matrix.name == 'macOS'
        run: |
          for dir in build/darwin-*; do
            arch="${dir##*-}"
            if [ "$arch" = amd64 ]; then arch=x64; fi
            for dmg in "$dir"/*.dmg; do
              mv "$dmg" "${dmg%.dmg}-$arch.dmg"
            done
          done
      - name: Make the RPM and Arch packages and the AppImages
        if: matrix.name == 'Linux'
        run: go run -C tools/linuxpkg . "$PWD/build/linux-amd64" "$PWD/build/linux-arm64"
      - name: Upload
        # What mygo build -upload uploads, update manifests last so that they
        # never point at a file that is not there yet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(build/*/*.dmg build/*/*" Setup "*.exe build/*/*.deb build/*/*.tar.gz build/*/*.delta
                 build/*/*.rpm build/*/*.pkg.tar.zst build/*/*.AppImage)
          scripts=(build/*/install.sh)
          if [ ${#scripts[@]} -gt 0 ]; then files+=("${scripts[0]}"); fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          manifests=(build/*/update-*.json)
          if [ ${#manifests[@]} -gt 0 ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${manifests[@]}"
          fi

  finish:
    # Links the uploaded files from the notes, under their names on GitHub,
    # and publishes a pre-release.
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.notes_only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write the release notes, with the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/release-notes.sh "$TAG" > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
      - name: Publish the pre-release
        if: contains(inputs.tag || github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
